{% extends 'base.html' %}

{% block content %}
<h1>Recipes List</h1>

{% for recipe in recipes %}
    <h2>{{ recipe.name }}</h2>
    <ul>
        {% for ingredient in recipe.ingredients %}
            <li>{{ ingredient.name}}, {{ ingredient.quantity }}</li>
            {% endfor %}
    </ul>
    <p><a href="..{{ recipe.link }}">Go To Recipe</a></p>
    {% endfor %}

{% endblock %}
